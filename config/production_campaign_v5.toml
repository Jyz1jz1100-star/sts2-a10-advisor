# FIRST PRODUCTION-SCALE CAMPAIGN ARM ON fidelity-v5 (Act 1-3, Ironclad A10, simulator only).
#
# Same arm as config/pilot_campaign.toml, one variable changed: the budget. The pilot ran
# 8M steps, which at n_steps=2048 x 12 envs is roughly 325 PPO updates, and reported a flat
# curve -- no direction across four evaluation points while the critic converged
# (explained_variance 0.001 -> 0.94, value_loss 63.3 -> 1.35) and mean return drifted down.
# "Flat" and "saturated" are different claims, and 325 updates cannot tell them apart. This
# run buys the eighth power of that: eight evaluation points instead of four, so the question
# "is there a direction at all" is answered with a trend rather than two endpoints.
#
# Deliberately NOT changed, and each is a separate arm with a separate reason:
#   * step_cost -- see the interpretation block at the bottom. It was written here as the
#     leading suspect for the pilot's drift; GPT-6-Astra pointed out on 2026-09-23 that the
#     arithmetic behind that fear was wrong, and the correction is in the block below. It is
#     still not touched by this arm, now because it is a weaker hypothesis than it looked, not
#     a stronger one.
#   * initialisation -- the clean init-isolation harness
#     (scripts/compare_pretrained_vs_vanilla_ppo.py) does not thread the campaign flag into
#     its evaluation factory, so using it today would score an Act-1 run as a full_run, the
#     exact defect fixed in the collector. It gets its own arm once that path is campaign-safe.
#   * the world -- v5 differs from v4 only by the removal of the engine's replayed-trace
#     overrides, measured at 3 of 1500 episodes and no win changes. The seeds are the pilot's,
#     so this run is comparable to it step for step.
#
# A run, not a promotion attempt: the promotion thresholds are held at shipped strictness, so
# a gate this cannot pass yet is the honest reading of where the policy stands.

version = 1

[target]
character = "IRONCLAD"
ascension = 10
save_load = false
game_branch = "public-beta-v0.111.0"

[runtime]
emulator_root = "../third_party/slay-the-spire-2-emulator-main"
run_dir = "runtime/production_campaign_v5"

[algorithm]
name = "MaskablePPO"
device = "auto"
n_steps = 2048
batch_size = 256
n_epochs = 8
gamma = 0.995
learning_rate = 0.0003
entropy_coefficient = 0.02

# Copied verbatim from b_terminal-1.toml. Read the caveat below before interpreting a
# flat curve as a failing network.
[reward]
gamma = 0.995
combat_reward_scale = 0.10
floor_weight = 1.0
hp_weight = 1.0
terminal_win_reward = 60.0
terminal_death_reward = -25.0
first_floor_advance_reward = 2.0
boundary_success_reward = 3.0
step_cost = 0.01

[curriculum]
stages = ["full_run"]

[stages.full_run]
# The world. Without this the simulator deals one act per seed and every artefact below
# describes an Act-1 run wearing a full_run label.
campaign = true
# Bounded: 40M steps over 8 evaluation points. Not the 500M stage budget.
timesteps = 40000000
parallel_envs = 12
checkpoint_every_steps = 5000000
checkpoint_eval_episodes = 200
promotion_eval_episodes = 500
# A campaign walk is three acts, not one: 4800 matches the horizon the fidelity gates
# and the act-boundary smoke measure campaign episodes on.
max_episode_steps = 4800
# No max_floor: the stage runs to the campaign's own terminal, which is the paired boss
# of the final act. A ceiling below floor 49 would collect half a campaign and score it
# as one, which the config loader now refuses outright.
initialize_from_previous = false
promotion_probe_every_steps = 20000000
# Held at the shipped full_run strictness on purpose. The pilot is not trying to
# promote; a gate it cannot pass yet is the honest reading of where the policy is.
min_boundary_rate = 0.0
min_win_rate = 0.20
min_wilson_lower = 0.18
max_truncation_rate = 0.05
max_illegal_actions = 0
min_episodes = 500

[stages.full_run.seeds.train]
start = 2000000000
count = 4000000

[stages.full_run.seeds.checkpoint]
start = 2008000000
count = 10000

[stages.full_run.seeds.promotion]
start = 2008010000
count = 10000

[stages.full_run.seeds.final]
start = 2008020000
count = 10000

# ---------------------------------------------------------------- interpretation
# step_cost was suspected of fighting depth. That suspicion was stated as: at a
# 4800-step campaign horizon, 0.01 per step can total -48 against a +60 win. The number is
# right and the inference was wrong -- returns are discounted at gamma = 0.995, so the
# present value of a continuing -0.01 per step is bounded by 0.01 / (1 - 0.995) = -2.0,
# about 3% of the +60 win, not 80% of it. Episode length still distorts comparisons
# between episodes of different lengths, which is why the death-floor and truncation
# distributions below are the first thing to read; it does not make quitting early the
# rational policy, and step_cost is no longer the leading explanation for the pilot's
# drift. (Caught by GPT-6-Astra on 2026-09-23; the arm is unchanged either way.)
#
# So the first thing to read off this run is the truncation and death-floor
# distribution, not the win rate: a policy that learns to end episodes early is a
# step-cost result, not a campaign result, and it must not be reported as the model
# failing to learn the game.
