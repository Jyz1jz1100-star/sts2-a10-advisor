# Production-scale PILOT for the three-act campaign (Act 1-3, Ironclad A10, simulator only).
#
# This is the bounded first run the 2026-09-22 closure directive asked for: an explicit
# ceiling, not the 500M-step budget in config/training.toml. Its question is "is the
# policy actually learning on the campaign, or is the training stack showing us another
# structural problem?" -- not "did it reach 50%".
#
# Everything except the world is held identical to the promoted act1 arm
# (runtime/fanout/b_terminal-1.toml): same algorithm block, same reward block, same
# batch/entropy/learning rate, and the same checkpoint as the warm start. That is
# deliberate. The single degree of freedom is `campaign`, so a change in the curve is
# attributable to the campaign and not to a reward edit made in the same commit.
#
# Seed ranges are a fresh block at 2.0e9, verified disjoint from every range declared in
# runtime/fanout/*.toml and config/training_v2*.toml (116 ranges checked). Checkpoint,
# promotion and final stay separate from train, and final is never read by the trainer.

version = 1

[target]
character = "IRONCLAD"
ascension = 10
save_load = false
game_branch = "public-beta-v0.111.0"

[runtime]
emulator_root = "../third_party/slay-the-spire-2-emulator-main"
run_dir = "runtime/pilot_campaign"

[algorithm]
name = "MaskablePPO"
device = "auto"
n_steps = 2048
batch_size = 256
n_epochs = 8
gamma = 0.995
learning_rate = 0.0003
entropy_coefficient = 0.02

# Copied verbatim from b_terminal-1.toml. Read the caveat below before interpreting a
# flat curve as a failing network.
[reward]
gamma = 0.995
combat_reward_scale = 0.10
floor_weight = 1.0
hp_weight = 1.0
terminal_win_reward = 60.0
terminal_death_reward = -25.0
first_floor_advance_reward = 2.0
boundary_success_reward = 3.0
step_cost = 0.01

[curriculum]
stages = ["full_run"]

[stages.full_run]
# The world. Without this the simulator deals one act per seed and every artefact below
# describes an Act-1 run wearing a full_run label.
campaign = true
# Bounded: 8M steps over 4 evaluation points. Not the 500M stage budget.
timesteps = 8000000
parallel_envs = 12
checkpoint_every_steps = 2000000
checkpoint_eval_episodes = 200
promotion_eval_episodes = 500
# A campaign walk is three acts, not one: 4800 matches the horizon the fidelity gates
# and the act-boundary smoke measure campaign episodes on.
max_episode_steps = 4800
# No max_floor: the stage runs to the campaign's own terminal, which is the paired boss
# of the final act. A ceiling below floor 49 would collect half a campaign and score it
# as one, which the config loader now refuses outright.
initialize_from_previous = false
promotion_probe_every_steps = 4000000
# Held at the shipped full_run strictness on purpose. The pilot is not trying to
# promote; a gate it cannot pass yet is the honest reading of where the policy is.
min_boundary_rate = 0.0
min_win_rate = 0.20
min_wilson_lower = 0.18
max_truncation_rate = 0.05
max_illegal_actions = 0
min_episodes = 500

[stages.full_run.seeds.train]
start = 2000000000
count = 4000000

[stages.full_run.seeds.checkpoint]
start = 2008000000
count = 10000

[stages.full_run.seeds.promotion]
start = 2008010000
count = 10000

[stages.full_run.seeds.final]
start = 2008020000
count = 10000

# ---------------------------------------------------------------- interpretation
# step_cost is the one term whose meaning changes with episode length. At 1600 steps an
# Act-1 walk pays at most -16 against a +60 win; at a 4800-step campaign horizon the same
# 0.01/step can reach -48, which is no longer a nudge toward efficiency but a competing
# objective against walking deep at all. It is left untouched here because changing the
# reward and the world in one step would make the pilot's curve unreadable.
#
# So the first thing to read off this run is the truncation and death-floor
# distribution, not the win rate: a policy that learns to end episodes early is a
# step-cost result, not a campaign result, and it must not be reported as the model
# failing to learn the game.
